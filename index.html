<title>Marketingová agentura ShortPRO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;800;900&family=Maven+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: směr C+A. Světlý papír a zakázky od klienta (C), navy lišta se skóre, profily influencerů a navy žebříček (A). Jeden sloupec do 560px. */
:root{
  --navy:#16323F; --navy2:#1F4252; --turq:#30E3CA; --turq-d:#0E8C7B; --mag:#D22A88;
  --paper:#F5F1EB; --card:#FFFFFF; --line:#DCE3E6; --muted:#4F6672; --bad:#C8372D; --soft:#E9F9F6;
  --disp:"League Spartan","Trebuchet MS",sans-serif; --body:"Maven Pro","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--navy)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
::selection{background:var(--turq);color:var(--navy)}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;margin:0;line-height:1.02;letter-spacing:-.01em}
h1{font-size:2.1rem;font-weight:900}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* lišta */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 20px;padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--disp);font-weight:900;font-size:1.05rem;letter-spacing:.01em}
.logo span{color:var(--turq)}
.pts{font-family:var(--disp);font-weight:800;font-size:.95rem;background:var(--turq);color:var(--navy);padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.screen{display:grid;gap:18px}
.lead{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:15px 18px;font-family:var(--disp);font-weight:800;font-size:1.05rem;background:var(--mag);color:#fff;transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .2s;box-shadow:0 6px 16px -8px rgba(210,42,136,.7)}
.btn.dark{background:var(--navy);box-shadow:0 6px 16px -8px rgba(22,50,63,.7)}
.btn.ghost{background:var(--card);color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn.full{width:100%}
.press{transition:transform .14s cubic-bezier(.2,.8,.2,1)}
.press:active:not(:disabled),.btn:active:not(:disabled){transform:scale(.97)}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:4px 0;justify-self:start;display:flex;gap:6px;align-items:center}
.back svg{width:18px;height:18px}
.docbar{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--navy);padding-bottom:8px;font-family:var(--disp);font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.docbar span:last-child{font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;font-family:var(--body);font-weight:500;color:var(--muted)}
/* klient (hero) */
.client{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 10px 24px -16px rgba(22,50,63,.4)}
.client .k{display:grid;gap:8px;min-width:0}
.client small{color:var(--muted);font-size:.85rem}
.hero-cup{width:110px;perspective:600px}
.hero-cup svg{width:100%;height:auto;transition:transform .3s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;filter:drop-shadow(0 14px 14px rgba(22,50,63,.25))}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--turq)}
/* zakázky */
.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;box-shadow:0 3px 8px -5px rgba(22,50,63,.3)}
.job .ic{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:var(--navy);color:var(--turq)}
.job .t{min-width:0}
.job .t b{display:block;font-family:var(--disp);font-size:1.12rem;font-weight:800}
.job .t small{color:var(--muted);font-size:.85rem}
.go{font-family:var(--disp);font-weight:800;font-size:.85rem;background:var(--mag);color:#fff;padding:7px 12px;border-radius:6px;white-space:nowrap}
.stamp{font-family:var(--disp);font-weight:900;font-size:.82rem;letter-spacing:.06em;color:var(--mag);border:2.5px solid var(--mag);border-radius:5px;padding:4px 7px;transform:rotate(-8deg);white-space:nowrap;font-variant-numeric:tabular-nums}
.job.done{border-color:var(--turq);background:var(--soft)}
.nick{display:grid;gap:8px;background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--line)}
.nick label{font-family:var(--disp);font-weight:800;font-size:1.1rem}
.nick input,.pin input{font:inherit;font-size:1.1rem;padding:13px 14px;border-radius:8px;border:2px solid var(--line);width:100%;background:#fff;color:var(--navy);caret-color:var(--mag)}
.nick input:focus,.pin input:focus{border-color:var(--navy);outline:none}
.nick .row{display:flex;gap:8px}
.nick .row input{flex:1;min-width:0}
.hint{font-size:.88rem;color:var(--muted)}
.err{color:var(--bad);font-weight:700;font-size:.95rem}
/* výsledek s razítkem */
.result{border-radius:10px;padding:20px;display:grid;gap:10px;background:var(--navy);color:#fff;position:relative;overflow:hidden}
.result .big{font-family:var(--disp);font-weight:900;font-size:2.6rem;color:var(--turq);font-variant-numeric:tabular-nums;line-height:1}
.result p{color:#CFE0E6}
.result .bigstamp{justify-self:start;margin:4px 0 6px;font-family:var(--disp);font-weight:900;font-size:1.05rem;letter-spacing:.08em;color:var(--turq);border:3px solid var(--turq);border-radius:6px;padding:6px 10px;transform:rotate(-10deg);animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{transform:rotate(-24deg) scale(2.4);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.result .btn{background:#fff;color:var(--navy);box-shadow:none}
/* Story */
.phone{background:linear-gradient(165deg,var(--navy) 0%,var(--navy2) 55%,#5A1E4C 100%);border-radius:24px;padding:16px;color:#fff;display:grid;gap:12px;aspect-ratio:9/14;max-width:100%;align-content:space-between;box-shadow:0 18px 30px -18px rgba(22,50,63,.7)}
.phone .bars{display:flex;gap:4px}.phone .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}.phone .bars i:first-child{background:#fff}
.phone .hook{font-family:var(--disp);font-weight:800;font-size:1.45rem;line-height:1.08;text-align:center;background:#fff;color:var(--navy);padding:12px;border-radius:10px;min-height:4.3em;display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.phone .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.phone .tags span{background:var(--turq);color:var(--navy);font-weight:700;padding:5px 11px;border-radius:6px;font-size:.92rem}
.phone .cupwrap{display:grid;place-items:center}
.phone .cupwrap svg{width:120px;height:auto;filter:drop-shadow(0 14px 14px rgba(0,0,0,.35))}
.checks{display:grid;gap:8px}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px;text-align:left}
.check .box{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--navy);display:grid;place-items:center;transition:background .15s}
.check .box svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.check.on{border-color:var(--turq);background:var(--soft)}.check.on .box{background:var(--turq-d);border-color:var(--turq-d)}.check.on .box svg{opacity:1}
.pin{display:flex;gap:8px}.pin input{flex:1;min-width:0;letter-spacing:.3em;text-align:center}
/* Triky */
.qprog{display:flex;gap:4px}.qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.qprog i.ok{background:var(--turq)}.qprog i.bad{background:var(--bad)}.qprog i.cur{background:var(--navy)}
.scene{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:20px 14px;display:grid;gap:12px;justify-items:center;text-align:center}
.cups{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap}
.cupbox{display:grid;justify-items:center;gap:4px;font-weight:500}
.price{font-family:var(--disp);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-size:.95rem;margin-right:6px;font-weight:500}
.tag{display:inline-block;background:var(--turq);color:var(--navy);font-weight:700;padding:4px 10px;border-radius:6px;font-size:.88rem}
.tag.hot{background:var(--mag);color:#fff}
.stars{display:flex;gap:2px;color:var(--mag)}.stars svg{width:20px;height:20px;fill:currentColor;stroke:none}
.shelf{width:100%;display:grid;gap:4px}
.shelf .row{display:flex;justify-content:center;gap:8px;align-items:flex-end;border-bottom:7px solid #C9B8A6;padding:8px 0 0;min-height:62px}
.shelf .row.gold{background:linear-gradient(transparent,rgba(48,227,202,.18))}
.shelf .lbl{font-size:.75rem;color:var(--muted);width:74px;text-align:right;flex:none;align-self:center}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:14px;display:flex;gap:12px;align-items:flex-start;font-size:1rem}
.opt b{font-family:var(--disp);font-weight:900;font-size:1rem;flex:none;width:20px;color:var(--mag)}
.opt.ok{border-color:var(--turq-d);background:var(--soft)}
.opt.bad{border-color:var(--bad);background:#FBECEA}
.explain{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:.98rem;display:grid;gap:4px}
.explain strong{font-family:var(--disp);font-weight:800;font-size:1.05rem}
/* Influenceři */
.budget{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--paper);padding:8px 0;display:grid;gap:6px}
.budget .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.budget .fill{height:100%;background:var(--turq-d);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.budget .fill.over{background:var(--bad)}
.budget .nums{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.ig{background:var(--card);border-radius:14px;border:2px solid var(--line);overflow:hidden;display:grid;transition:border-color .2s,box-shadow .2s,transform .14s cubic-bezier(.2,.8,.2,1)}
.ig.sel{border-color:var(--mag);box-shadow:0 10px 24px -14px rgba(210,42,136,.7)}
.ig.right{border-color:var(--turq-d)}.ig.wrong{border-color:var(--bad)}
.ig .top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 14px 8px}
.ava{width:76px;height:76px;border-radius:50%;padding:3px;background:conic-gradient(var(--turq),var(--mag),var(--turq))}
.ava div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:1.5rem;color:#fff}
.handle{font-weight:700;font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:.78rem;color:var(--muted);margin-top:6px}
.stats b{display:block;color:var(--navy);font-size:1.02rem;font-variant-numeric:tabular-nums}
.ig .bio{padding:0 14px 12px;font-size:.95rem}
.ig .bio strong{display:block}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid9 div{aspect-ratio:1;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.grid9 svg{width:34%;height:34%}
.facts{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;background:#F2F5F6;font-size:.92rem}
.facts div span{display:block;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.facts div b{font-variant-numeric:tabular-nums}
.ig .pick{margin:12px 14px 14px;border-radius:8px;padding:13px;font-family:var(--disp);font-weight:800;font-size:1rem;border:2px solid var(--navy);background:var(--card)}
.ig.sel .pick{background:var(--mag);border-color:var(--mag);color:#fff}
.verdict{margin:0 14px 14px;font-size:.95rem;display:flex;gap:8px;align-items:flex-start}
.verdict svg{width:20px;height:20px;flex:none;margin-top:1px}
.verdict.y svg{stroke:var(--turq-d)}.verdict.n svg{stroke:var(--bad)}
/* Tým */
.camp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.camp.right{border:2px solid var(--turq-d)}.camp.wrong{border:2px solid var(--bad)}
.camp .need{font-size:.9rem;color:var(--muted)}
.fb{display:flex;gap:8px;align-items:flex-start;font-size:.98rem;padding:10px 12px;border-radius:8px}
.fb svg{width:20px;height:20px;flex:none;margin-top:1px;fill:none;stroke-width:3;stroke-linecap:round}
.fb.y{background:var(--soft)}.fb.y svg{stroke:var(--turq-d)}
.fb.n{background:#FBECEA}.fb.n svg{stroke:var(--bad)}
.quote .who s{color:var(--bad);margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px;font-size:.92rem;font-weight:500;transition:background .15s,transform .14s cubic-bezier(.2,.8,.2,1)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.ok{background:var(--turq);border-color:var(--turq);color:var(--navy);font-weight:700}
.chip.miss{border-color:var(--turq-d);border-style:dashed}
.chip.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.role{background:var(--card);border-radius:8px;padding:10px;border:1px solid var(--line);font-size:.88rem}
.role b{display:block;font-family:var(--disp);font-size:1rem}
details.legend summary{cursor:pointer;font-weight:700}
/* Kdo to řekl */
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.person span{min-width:0}
.person{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 6px;display:grid;justify-items:center;gap:4px;text-align:center;font-size:.85rem;font-weight:700;position:relative}
.person svg{width:100%;max-width:84px;height:auto}
.person.armed{border-color:var(--mag)}
.person .badge{position:absolute;top:6px;right:6px;background:var(--mag);color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 5px;display:grid;place-items:center;font-size:.78rem}
.quotes{display:grid;gap:8px}
.quote{background:var(--card);border:2px solid var(--line);border-radius:14px 14px 14px 3px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start;font-size:1rem}
.quote .n{font-family:var(--disp);font-weight:900;font-size:.9rem;background:var(--navy);color:#fff;border-radius:999px;width:26px;height:26px;flex:none;display:grid;place-items:center}
.quote.armed{border-color:var(--mag);box-shadow:0 8px 18px -12px rgba(210,42,136,.8)}
.quote .who{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--mag);text-align:right;max-width:40%}
.quote.ok{border-color:var(--turq-d)}.quote.bad{border-color:var(--bad)}
/* Žebříček (navy obrazovka) */
.tv{background:var(--navy);color:#fff;border-radius:12px;padding:22px;display:grid;gap:14px}
.tv h1{color:#fff;font-size:clamp(1.8rem,4.5vw,3.2rem)}
.tv .back{color:#CFE0E6}
.board{display:grid;gap:8px}
.lb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--navy2);border-radius:8px;padding:12px 16px;font-variant-numeric:tabular-nums;font-size:clamp(1rem,2.2vw,1.6rem)}
.lb .r,.lb .s{font-family:var(--disp);font-weight:900}
.lb.p1{background:var(--turq);color:var(--navy)}.lb.p2{background:#CFE0E6;color:var(--navy)}.lb.p3{background:#F3C2DD;color:var(--navy)}
.lb.me{outline:3px solid var(--mag)}
.lvl{display:inline-flex;align-items:center;gap:3px;font-family:var(--disp);font-weight:800;font-size:.72em;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 7px;vertical-align:.12em;white-space:nowrap}
.lvl-junior{background:#30E3CA33;color:inherit;border:1.5px solid var(--turq)}
.lvl-medior{background:#16323F;color:#30E3CA;border:1.5px solid #30E3CA}
.lvl-senior{background:var(--mag);color:#fff;border:1.5px solid var(--mag)}
.lvl .star{width:1em;height:1em;fill:#FFD84D;stroke:none}
.job .t small .lvl{display:inline-flex;font-size:.72rem;padding:1px 6px;margin-right:4px}
.badge-name.extra{display:inline-flex;gap:6px;align-items:center;color:var(--mag)}
.badge-name.extra .star{width:1.2em;height:1.2em;fill:var(--mag)}
.demo{font-size:.85rem;color:#CFE0E6;text-align:center}
.job:disabled{opacity:.45;cursor:not-allowed}
.stamp.mid{color:var(--navy);border-color:var(--navy)}
.stamp.low{color:var(--muted);border-color:#B9C6CC}
.result .bigstamp.mid{color:#fff;border-color:#fff}
.result .bigstamp.low{color:#9FB6C0;border-color:#9FB6C0}
.opt .mark{margin-left:auto;display:grid}
.opt .mark svg{width:22px;height:22px;fill:none;stroke-width:3;stroke-linecap:round}
.opt.ok .mark svg{stroke:var(--turq-d)}.opt.bad .mark svg{stroke:var(--bad)}
.explain.y{border-color:var(--turq-d)}.explain.n{border-color:var(--bad)}
.recap{display:grid;gap:6px}
.fb.flag{margin:12px 14px 0}
.quote .who.y{color:var(--turq-d)}.quote .who.n{color:var(--navy)}
.quote .who svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;vertical-align:-2px}
.castbar{position:sticky;bottom:0;z-index:3;background:var(--paper);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;border-top:1px solid var(--line)}
.castbar .cast{gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.castbar .person{display:flex;align-items:center;gap:6px;padding:6px;min-height:48px;font-size:.74rem;text-align:left;line-height:1.1}
.castbar .person svg{width:26px;max-width:26px;flex:none}
.castbar .person .badge{top:-6px;right:-4px}
.need.warn{color:var(--bad);font-weight:700}
.back{min-height:44px}
.chip{min-height:44px}
body.tvmode .bar{display:none}
body.tvmode .wrap{max-width:none}
body.tvmode{padding-block:16px}
.tvgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:900px){.tvgrid{grid-template-columns:minmax(0,1fr) minmax(220px,24vw)}}
.tvmain{display:grid;gap:14px;min-width:0}
.barr{display:flex;align-items:center;gap:8px}
.snd{background:none;border:2px solid #ffffff40;border-radius:999px;width:40px;height:40px;display:grid;place-items:center;color:#fff;padding:0}
.snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tvsnd{background:var(--mag);color:#fff;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:800;display:inline-flex;gap:8px;align-items:center;justify-self:start}
.tvsnd.on{background:#ffffff1f}
.tvsnd svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tvtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

let state = load('sp-state2', {});

function setScore(task, pts, secs){

  countUp(before, total());
  const board = load('sp-board', {}); board[state.nick] = {total:total(), lvl:playerLvl(), star:seniorStar()}; save('sp-board', board);
  if(SCORE_API) fetch(SCORE_API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({nick:state.nick, task, points:pts, secs, first:((state.raw||{})[task]>=100)?1:0})}).catch(()=>{});
}
function updPts(){ $('#pts').textContent = total() + ' b' }
function countUp(a, b){
  const el = $('#pts'), t0 = performance.now(), d = 700;
  const step = t => { const k = Math.min(1,(t-t0)/d), e = 1-Math.pow(1-k,3); el.textContent = Math.round(a+(b-a)*e)+' b'; if(k<1) requestAnimationFrame(step) };
  requestAnimationFrame(step);
}

const TASKS = [
  {id:'story', pic:'i-cam', name:'Story pro Instagram', role:'Kreativa', time:'4 min', badge:'Kreativec', lvl:'Junior'},

const T = id => TASKS.find(t=>t.id===id);
/* Čas: od prvního otevření úkolu. Při plném počtu bodů se zbývající sekundy připíšou jako bonus (David 23. 11.). */
const LIMIT = {story:240, triky:180, influ:180, tym:240, kdo:120};
let clockTimer = null;
function startClock(sv){ if(!sv.start){ sv.start = Date.now(); persist() } }

const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function runClock(id){
  clearInterval(clockTimer);
  const tick = () => { const el = $('#clock'); if(!el || isDone(id)){ if(isDone(id)) clearInterval(clockTimer); return } const left = LIMIT[id] - elapsed(id);
    el.innerHTML = left > 0 ? `${ic('clock','')}<span>Bonus za rychlost: <b>${mmss(left)}</b></span>` : `${ic('clock','')}<span>Bonus za rychlost vypršel, body za správnost platí dál.</span>`;

const SPK_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

/* TV: hudba ve smyčce (Web Audio, bez mezery) + každých 45 s hlasatel, hudba se ztiší */
const TV = {ctx:null, gain:null, src:null, on:false, timer:null, last:'', buf:null};
const ANN = ['ann1','ann2','ann3','ann4','ann5','ann6','ann7','ann8'];
async function tvStart(){
  try{
    TV.ctx = TV.ctx || new (window.AudioContext||window.webkitAudioContext)(); await TV.ctx.resume();
    if(!TV.buf) TV.buf = await TV.ctx.decodeAudioData(await (await fetch('audio/hudba-loop.mp3')).arrayBuffer());
    TV.gain = TV.ctx.createGain(); TV.gain.gain.value = .55; TV.gain.connect(TV.ctx.destination);
    TV.src = TV.ctx.createBufferSource(); TV.src.buffer = TV.buf; TV.src.loop = true; TV.src.connect(TV.gain); TV.src.start();
    TV.on = true; clearInterval(TV.timer); TV.timer = setInterval(tvAnnounce, 45000); setTimeout(tvAnnounce, 4000);
  }catch(e){ TV.on = false }
  tvBtn();
}
function tvStop(){ try{ TV.src && TV.src.stop() }catch(e){} TV.src = null; TV.on = false; clearInterval(TV.timer); tvBtn() }
function tvAnnounce(){
  if(!TV.on) return; let id; do{ id = pick(ANN) }while(id === TV.last); TV.last = id;
  const g = TV.gain.gain, t = TV.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(.15, t+.6);
  const a = new Audio('audio/cs/'+id+'.mp3'); a.volume = 1;
  const up = ()=>{ const t2 = TV.ctx.currentTime; g.cancelScheduledValues(t2); g.setValueAtTime(g.value, t2); g.linearRampToValueAtTime(.55, t2+1.2) };
  a.onended = up; a.onerror = up; setTimeout(()=>a.play().catch(up), 700);
}
function tvBtn(){ const b = $('#tvsnd'); if(!b) return; b.classList.toggle('on', TV.on); b.innerHTML = (TV.on ? SPK_ON+' Vypnout hudbu' : SPK_ON+' Zapnout hudbu a hlasatele') }
document.addEventListener('click', e=>{ if(e.target.closest('#tvsnd')){ TV.on ? tvStop() : tvStart() } });

function award(id, base){
  const secs = elapsed(id), bonus = base >= 100 ? Math.max(0, LIMIT[id] - secs) : 0;
  state.bonus = state.bonus || {}; state.secs = state.secs || {}; state.raw = state.raw || {};
  state.bonus[id] = bonus; state.secs[id] = secs; state.raw[id] = base; clearInterval(clockTimer);
  setScore(id, Math.round(base * MULT[T(id).lvl]) + bonus, secs); fx('win', 'Schváleno!');
  say(TASKS.every(t=>isDone(t.id)) ? 'final' : id);
}
/* Animace dobře / špatně: overlay přes celou obrazovku, při dokončení konfety */
function fx(kind, msg, v){
  if(v) say(v);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ return }
  document.querySelectorAll('.fx').forEach(n=>n.remove());
  const d = document.createElement('div'); d.className = 'fx fx-'+kind; d.setAttribute('aria-hidden','true');
  d.innerHTML = `<div class="fx-badge">${ic(kind==='bad'?'x':'check','')}<span>${msg}</span></div>` +
    (kind==='win' ? Array.from({length:28},(_,i)=>`<i style="--x:${(Math.random()*2-1)*48}vw;--y:${-(30+Math.random()*45)}vh;--r:${Math.random()*720-360}deg;--d:${(Math.random()*.25).toFixed(2)}s;background:${['#30E3CA','#D22A88','#16323F','#FFFFFF'][i%4]}"></i>`).join('') : '');
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), kind==='win' ? 1600 : 900);
}

/* Kelímek se naklání podle prstu nebo náklonu telefonu */
function tilt(el){
  if(!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const p = el.querySelector('img');
  const set = (x,y) => { p.style.transform = `rotateY(${x*20}deg) rotateX(${-y*12}deg) translateY(${-Math.abs(x)*5}px)` };
  el.addEventListener('pointermove', e=>{ const r = el.getBoundingClientRect(); set((e.clientX-r.left)/r.width-.5, (e.clientY-r.top)/r.height-.5) });
  el.addEventListener('pointerleave', ()=>set(0,0));
  const onOri = e => { if(e.gamma==null) return; set(Math.max(-1,Math.min(1,e.gamma/30))/2, Math.max(-1,Math.min(1,(e.beta-45)/30))/2) };
  el.addEventListener('click', ()=>{ const D = window.DeviceOrientationEvent; if(D && D.requestPermission) D.requestPermission().then(r=>{ if(r==='granted') addEventListener('deviceorientation', onOri) }).catch(()=>{}) });
  if(window.DeviceOrientationEvent && !DeviceOrientationEvent.requestPermission) addEventListener('deviceorientation', onOri);
}

  const pts = state.scores[task], bonus = (state.bonus||{})[task] || 0, base = pts - bonus, secs = (state.secs||{})[task];

function triky(){
  const t = T('triky'), sv = state.saved.triky || (state.saved.triky = {q:0, wrong:[], att:[]});
  if(!sv.att) sv.att = []; if(!isDone('triky')) startClock(sv);
  const tries = sv.att.reduce((a,b)=>a+b,0) - TRICKS.length + 1; // 1 = vše napoprvé
  if(sv.q >= TRICKS.length){
    const fresh = !isDone('triky');
    if(fresh){ const avg = sv.att.reduce((a,n)=>a+[100,60,30][Math.min(n,3)-1],0)/TRICKS.length; award('triky', Math.round(avg)); buzz([20,40,30]) }
    app.innerHTML = `${header(t,2)}<h2>Teď víš, jak tě obchody ovlivňují</h2>` +
      result('triky', `Všech ${TRICKS.length} triků máš správně. Až půjdeš příště nakupovat, zkus najít aspoň tři z nich.`, Math.max(1,tries)) +
      `<div class="recap">${TRICKS.map(Q=>`<p class="fb y">${ic('check','')}<span><b>${Q.e[0]}.</b> ${Q.q}</span></p>`).join('')}</div>`;
    return;
  }
  const Q = TRICKS[sv.q];
  if(!sv.order || sv.order.q !== sv.q){ const rest = Q.o.map((x,i)=>i).filter(i=>i!==Q.a); rest.splice(Q.pos,0,Q.a); sv.order = {q:sv.q, o:rest} }
  const order = sv.order.o, wrong = new Set(sv.wrong);
  app.innerHTML = `${header(t,2)}
  <div class="qprog" aria-label="Otázka ${sv.q+1} ze ${TRICKS.length}">${TRICKS.map((x,i)=>`<i class="${i<sv.q?'ok':i===sv.q?'cur':''}"></i>`).join('')}</div>
  <div class="scene">${Q.scene()}</div>
  <h2>${Q.q}</h2>
  <div class="opts">${order.map((i,k)=>`<button class="opt press ${wrong.has(i)?'bad':''}" data-o="${i}" ${wrong.has(i)?'disabled':''}><b>${'ABC'[k]}</b><span>${Q.o[i]}</span><span class="mark">${wrong.has(i)?ic('x',''):''}</span></button>`).join('')}</div>
  <div id="ex">${wrong.size?warn('To není ono. Zkus jinou odpověď.'):''}</div>`;
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    const i = +b.dataset.o;
    if(i !== Q.a){ sv.wrong.push(i); persist(); buzz([30,40,30]); fx('bad','To není ono', sv.wrong.length>1 ? 'bad2' : 'q_bad1'); triky(); shake(app.querySelector(`[data-o="${i}"]`)); return }
    sv.att[sv.q] = sv.wrong.length + 1; persist(); buzz(20); fx('good','Správně!', pick(['q_ok1','q_ok2','q_ok3']));
    app.querySelectorAll('[data-o]').forEach(x=>{ x.disabled=true; if(+x.dataset.o===Q.a){ x.classList.add('ok'); x.querySelector('.mark').innerHTML = ic('check','') } });
    $('#ex').innerHTML = `<div class="explain y"><strong>Správně. ${Q.e[0]}</strong>${Q.e[1]}</div><br><button class="btn full" id="nq">${sv.q+1<TRICKS.length?'Další otázka':'Odevzdat klientovi'}</button>`;
    $('#nq').onclick = ()=>{ sv.q++; sv.wrong = []; persist(); triky(); window.scrollTo(0,0) };
    $('#ex').scrollIntoView({behavior:'smooth', block:'nearest'});
  });
}

  ['inf','Influencer manažer','vybírá influencery a domlouvá s nimi spolupráci'],['gra','Grafik','dělá vizuály, bannery a šablony'],
  ['copy','Copywriter','píše texty, popisky a slogany'],['kam','Kameraman','natáčí profi kamerou ve studiu'],
  ['her','Herečka','hraje v reklamním spotu'],['str','Střihač','skládá profi záběry do hotového spotu'],

  {t:'Instagram a TikTok vietnamské restaurace: natočit videa jídel, naplánovat příspěvky na celý měsíc a pustit placenou reklamu lidem v okolí', n:3, a:['cc','smm','ads']},

];
function tym(){
  const t = T('tym'), sv = state.saved.tym || (state.saved.tym = {team:CAMPS.map(()=>[]), tries:0, checked:CAMPS.map(()=>null)});
  while(sv.team.length<CAMPS.length){ sv.team.push([]); sv.checked.push(null) }
  const team = sv.team.map(a=>new Set(a)), done = isDone('tym'); if(!done) startClock(sv);
  const campOk = ci => CAMPS[ci].a.every(x=>team[ci].has(x)) && team[ci].size===CAMPS[ci].n;
  app.innerHTML = `${header(t,4)}<h2>Jsi projektový manažer. Sestav týmy.</h2>
  ${done ? result('tym', 'Všechny 4 týmy máš sestavené správně. Přesně takhle se v agentuře skládá tým na každou zakázku.', sv.tries) :
  `<p class="lead">Pro každou kampaň vyber lidi z agentury. Kolik jich potřebuješ, je napsané u kampaně. Ty jako projekťák jsi v každém týmu automaticky.</p>`}
  <details class="legend"><summary>Kdo co dělá</summary><br><div class="roles">${ROLES.map(r=>`<div class="role"><b>${r[1]}</b>${r[2]}</div>`).join('')}</div></details>
  ${CAMPS.map((c,ci)=>{ const ch = sv.checked[ci], locked = done || ch===true;
    const fb = ch===true ? `<p class="fb y">${ic('check','')}<span><b>Správně.</b> Tenhle tým kampaň zvládne.</span></p>`
      : ch===false ? `<p class="fb n">${ic('x','')}<span><b>Tady to ještě nesedí.</b> Někdo v týmu chybí nebo tam nepatří. Uprav ho a zkontroluj znovu.</span></p>` : '';
    return `<section class="camp ${ch===true||done?'right':ch===false?'wrong':''}"><h3>${c.t}</h3>${fb}${locked?'':`<span class="need" id="need${ci}">Vyber ${c.n} · vybráno ${team[ci].size}</span>`}
    <div class="chips">${ROLES.map(r=>`<button class="chip press ${team[ci].has(r[0])?(locked?'ok':'on'):''}" data-c="${ci}" data-r="${r[0]}" ${locked?'disabled':''}>${r[1]}</button>`).join('')}</div></section>`}).join('')}
  ${done?'':`<button class="btn full" id="tsub" ${team.every((s,i)=>s.size===CAMPS[i].n)?'':'disabled'}>${sv.tries?'Zkontrolovat znovu':'Odeslat týmy'}</button>`}`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ const ci=+b.dataset.c, s=team[ci], r=b.dataset.r, n=CAMPS[ci].n;
    if(s.has(r)) s.delete(r); else if(s.size<n) s.add(r); else { buzz([30,40,30]); const el=$('#need'+ci); el.textContent=`Tým je plný (${n}). Nejdřív někoho odeber.`; el.classList.add('warn'); return }
    sv.team = team.map(x=>[...x]); if(sv.checked[ci]===false) sv.checked[ci]=null; persist(); buzz(10); const y=scrollY; tym(); scrollTo(0,y) });
  const s = $('#tsub'); if(s) s.onclick = ()=>{
    sv.tries++; sv.checked = CAMPS.map((c,ci)=>campOk(ci)); persist();
    if(sv.checked.every(Boolean)){ result('tym','',sv.tries,true); tym(); window.scrollTo(0,0); return }
    buzz([30,40,30]); fx('bad','Ještě to nesedí', sv.tries>2 ? 'bad2' : 'tym_bad'); tym(); app.querySelectorAll('.camp.wrong').forEach(shake); const w = app.querySelector('.camp.wrong'); if(w) w.scrollIntoView({behavior:'smooth', block:'center'});
  };
}

function sil(prop){

    kam:`<rect x="60" y="70" width="30" height="20" rx="4" fill="${N}"/><circle cx="94" cy="80" r="7" fill="${N}"/><circle cx="75" cy="80" r="5" fill="#30E3CA"/>`,

    copy:`<rect x="58" y="76" width="36" height="5" rx="2" transform="rotate(-35 77 78)" fill="#30E3CA"/>`,
    perf:`<path d="M58 98 L68 86 L76 92 L94 70" stroke="#30E3CA" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
    inf:`<rect x="64" y="62" width="18" height="32" rx="4" fill="${N}"/><rect x="67" y="66" width="12" height="22" rx="2" fill="#30E3CA"/>`,
    comm:`<path d="M58 66 h36 a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 h-22 l-8 7 v-7 h-6 a4 4 0 0 1 -4 -4 v-18 a4 4 0 0 1 4 -4z" fill="#30E3CA"/><circle cx="68" cy="79" r="2.5" fill="${N}"/><circle cx="76" cy="79" r="2.5" fill="${N}"/><circle cx="84" cy="79" r="2.5" fill="${N}"/>`,
    gra:`<circle cx="76" cy="84" r="13" fill="${N}"/><circle cx="71" cy="80" r="3" fill="#30E3CA"/><circle cx="80" cy="79" r="3" fill="#D22A88"/><circle cx="78" cy="89" r="3" fill="#fff"/>`,
  }[prop];
  return `<svg viewBox="0 0 100 110" aria-hidden="true"><circle cx="50" cy="30" r="18" fill="${N}"/><path d="M16 108 q0 -48 34 -48 q34 0 34 48z" fill="${N}"/>${P}</svg>`;
}
const CAST = [['kam','Content creator'],['pm','Projektový manažer'],['comm','Community manažer'],['perf','Ads manažer'],['inf','Influencer manažer'],['copy','Copywriter']];
const LINES = [
  ['„Ten záběr je rozmazaný, točím to znovu.“','kam'],
  ['„Deadline je v pátek v 10. Kdo nestíhá, ať se ozve hned.“','pm'],
  ['„Pod videem je 300 komentářů, do večera na všechny odpovím.“','comm'],
  ['„Za reklamu jsme dali 5 000 Kč a přišlo 200 objednávek.“','perf'],
  ['„Tenhle creator má falešné sledující, nebereme ho.“','inf'],
];
let armed = 0;
function kdo(){
  const t = T('kdo'), sv = state.saved.kdo || (state.saved.kdo = {match:{}, tries:0, ok:[], bad:[]});
  const match = sv.match, done = isDone('kdo'), okSet = new Set(sv.ok), badSet = new Set(sv.bad); if(!done) startClock(sv);
  const nameOf = id => CAST.find(c=>c[0]===id)[1];
  if(armed==null || match[armed]!=null || okSet.has(armed)){ const n = LINES.findIndex((l,i)=>match[i]==null); armed = n<0?null:n }
  app.innerHTML = `${header(t,5)}<h2>Kdo to řekl?</h2>
  ${done ? result('kdo', 'Všech 5 vět máš přiřazených správně. Teď víš, kdo v agentuře co řeší.', sv.tries) :
  `<p class="lead">Klepni na větu a pak dole na člověka, který ji na poradě nejspíš řekl. Jeden člověk je navíc.</p>
   ${badSet.size?warn(`${badSet.size===1?'Jedna věta nesedí':`${badSet.size} věty nesedí`}. Jsou označené červeně, přiřaď je znovu.`):''}`}
  <div class="quotes">${LINES.map((l,i)=>{ const m = match[i], locked = done || okSet.has(i);
    const st = locked?'ok':badSet.has(i)?'bad':(armed===i?'armed':'');
    return `<button class="quote press ${st}" data-q="${i}" ${locked?'disabled':''}><span class="n">${i+1}</span><span>${l[0]}</span>${m?`<span class="who ${locked?'y':''}">${locked?ic('check','')+' ':''}${nameOf(m)}</span>`:badSet.has(i)?`<span class="who no">Nesedí</span>`:''}</button>`}).join('')}</div>
  ${done ? '' : `<div class="castbar"><p class="hint">${armed!=null?`Kdo řekl větu ${armed+1}?`:'Všechno přiřazeno. Můžeš odeslat, nebo klepnout na větu a změnit ji.'}</p>
  <div class="cast">${CAST.map(c=>{ const used = Object.entries(match).filter(([k,v])=>v===c[0]).map(([k])=>+k+1);
    return `<button class="person press" data-w="${c[0]}">${used.length?`<span class="badge">${used.join(',')}</span>`:''}${sil(c[0])}<span>${c[1]}</span></button>`}).join('')}</div></div>
  <button class="btn full" id="ksub" ${Object.keys(match).length===LINES.length?'':'disabled'}>${sv.tries?'Zkontrolovat znovu':'Odeslat'}</button>`}`;
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ armed = +b.dataset.q; buzz(10); kdo() });
  app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ if(armed==null) return; match[armed]=b.dataset.w; badSet.delete(armed); sv.bad=[...badSet]; persist(); buzz(15);
    const next = LINES.findIndex((l,i)=>match[i]==null); armed = next<0?null:next; kdo() });
  const s = $('#ksub'); if(s) s.onclick = ()=>{
    sv.tries++;
    LINES.forEach((l,i)=>{ if(match[i]===l[1]) okSet.add(i); else { badSet.add(i); delete match[i] } });
    sv.ok=[...okSet]; sv.bad=[...badSet]; persist();
    if(okSet.size===LINES.length){ result('kdo','',sv.tries,true); kdo(); window.scrollTo(0,0); return }
    buzz([30,40,30]); fx('bad','Ještě to nesedí', sv.tries>2 ? 'bad2' : 'kdo_bad'); armed = LINES.findIndex((l,i)=>match[i]==null); kdo(); window.scrollTo(0,0); app.querySelectorAll('.quote.bad').forEach(shake);
  };
}
