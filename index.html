<title>Marketingová agentura ShortPRO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: jeden sloupec do 560px jako mobilní appka, nahoře lišta s body, každý úkol je samostatná obrazovka */
:root{
  --bg:#EEF2FB; --ink:#141B34; --muted:#5B6385; --card:#FFFFFF; --line:#D7DDEE;
  --chili:#F2482B; --sun:#FFC53D; --mint:#1FB57A; --sky:#3D6BF2; --wrong:#D93A3A;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .logo{font-family:var(--display);font-weight:800;font-size:.85rem;letter-spacing:.02em}
.bar .logo b{color:var(--sun)}
.pts{font-family:var(--display);font-size:.85rem;background:var(--chili);padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.screen{display:grid;gap:16px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--chili)}
.lead{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;background:var(--ink);color:#fff;font-size:1rem}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:4px 0;justify-self:start}
/* Domů */
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:22px;display:grid;gap:10px;position:relative;overflow:hidden}
.hero h1{color:#fff}
.hero p{color:#C9CFEA}
.hero .cup{position:absolute;right:-18px;bottom:-26px;width:120px;opacity:.95}
.hero > *:not(.cup){position:relative;max-width:78%}
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left}
.task .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem}
.task .t{min-width:0}
.task .t small{display:block;color:var(--muted);font-size:.82rem}
.task .st{font-family:var(--display);font-size:.8rem;font-variant-numeric:tabular-nums}
.task.done{border-color:var(--mint)}
.task.done .st{color:var(--mint)}
.nick{display:grid;gap:8px;background:var(--card);border-radius:18px;padding:16px;border:2px solid var(--line)}
.nick input{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);width:100%}
.nick .row{display:flex;gap:8px}
.nick .row input{flex:1;min-width:0}
/* Výsledek */
.result{border-radius:18px;padding:18px;display:grid;gap:8px;background:var(--ink);color:#fff}
.result .big{font-family:var(--display);font-size:2.2rem;color:var(--sun);font-variant-numeric:tabular-nums}
.result p{color:#C9CFEA}
/* Story */
.phone{background:linear-gradient(160deg,#FF7A45,#F2482B 45%,#8E2DE2);border-radius:26px;padding:16px;color:#fff;display:grid;gap:10px;aspect-ratio:9/13;max-width:100%;align-content:space-between;position:relative}
.phone .bars{display:flex;gap:4px}.phone .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.5)}.phone .bars i:first-child{background:#fff}
.phone .hook{font-family:var(--display);font-size:1.25rem;line-height:1.2;text-align:center;background:rgba(0,0,0,.25);padding:12px;border-radius:14px;min-height:4.2em;display:grid;place-items:center}
.phone .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.phone .tags span{background:#fff;color:var(--ink);font-weight:700;padding:4px 10px;border-radius:8px;font-size:.85rem}
.phone .cupwrap{display:grid;place-items:center}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.check .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800}
.check.on{border-color:var(--mint)}.check.on .box{background:var(--mint);border-color:var(--mint);color:#fff}
.pin{display:flex;gap:8px}.pin input{flex:1;min-width:0;font:inherit;font-size:1.2rem;letter-spacing:.3em;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--line)}
.hint{font-size:.85rem;color:var(--muted)}
.err{color:var(--wrong);font-weight:700;font-size:.9rem}
/* Kvíz */
.qprog{display:flex;gap:4px}.qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.qprog i.ok{background:var(--mint)}.qprog i.bad{background:var(--wrong)}.qprog i.cur{background:var(--ink)}
.scene{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:18px;display:grid;gap:12px;justify-items:center;text-align:center}
.cups{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap}
.cupbox{display:grid;justify-items:center;gap:4px}
.price{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-size:.85rem;margin-right:6px}
.tag{display:inline-block;background:var(--sun);font-weight:700;padding:4px 10px;border-radius:8px;font-size:.85rem}
.tag.red{background:var(--chili);color:#fff}
.shelf{width:100%;display:grid;gap:6px}
.shelf .row{display:flex;justify-content:center;gap:6px;align-items:center;border-bottom:6px solid #B98A5B;padding:6px 0 2px;min-height:58px}
.shelf .lbl{font-size:.7rem;color:var(--muted);width:72px;text-align:right;flex:none}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;gap:10px;align-items:flex-start}
.opt b{font-family:var(--display);font-size:.85rem;flex:none;width:24px}
.opt.ok{border-color:var(--mint);background:#E6F8F0}
.opt.bad{border-color:var(--wrong);background:#FCE9E9}
.explain{background:#FFF6DB;border-radius:14px;padding:14px;font-size:.95rem}
.explain strong{font-family:var(--display);font-size:.85rem;display:block;margin-bottom:4px}
/* Influenceři */
.budget{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--bg);padding:8px 0;display:grid;gap:6px}
.budget .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.budget .fill{height:100%;background:var(--mint);transition:width .25s}
.budget .fill.over{background:var(--wrong)}
.budget .nums{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.ig{background:var(--card);border-radius:20px;border:3px solid var(--line);overflow:hidden;display:grid}
.ig.sel{border-color:var(--sky);box-shadow:0 0 0 3px rgba(61,107,242,.18)}
.ig.right{border-color:var(--mint)}.ig.wrong{border-color:var(--wrong)}
.ig .top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 14px 8px}
.ava{width:74px;height:74px;border-radius:50%;padding:3px;background:conic-gradient(#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75)}
.ava div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:2rem}
.ig .handle{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:.75rem;color:var(--muted);margin-top:6px}
.stats b{display:block;color:var(--ink);font-size:.98rem;font-variant-numeric:tabular-nums}
.ig .bio{padding:0 14px 10px;font-size:.9rem}
.ig .bio strong{display:block}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid9 div{aspect-ratio:1;display:grid;place-items:center;font-size:1.6rem}
.card{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;background:#F6F8FE;font-size:.85rem}
.card div span{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.card div b{font-variant-numeric:tabular-nums}
.ig .pick{margin:12px 14px 14px;border-radius:12px;padding:12px;font-weight:700;border:2px solid var(--ink);background:var(--card)}
.ig.sel .pick{background:var(--sky);border-color:var(--sky);color:#fff}
.verdict{margin:0 14px 14px;font-size:.88rem;font-weight:500}
/* Tým */
.camp{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.camp.right{border-color:var(--mint)}.camp.wrong{border-color:var(--wrong)}
.camp .need{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 11px;font-size:.88rem;font-weight:500;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.ok{background:var(--mint);border-color:var(--mint);color:#fff}
.chip.miss{border-color:var(--mint);border-style:dashed}
.chip.bad{background:var(--wrong);border-color:var(--wrong);color:#fff}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.role{background:var(--card);border-radius:14px;padding:10px;border:2px solid var(--line);font-size:.82rem}
.role b{display:block;font-size:.9rem}
details.legend summary{cursor:pointer;font-weight:700}
/* Kdo to řekl */
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.person{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 6px 10px;display:grid;justify-items:center;gap:4px;text-align:center;font-size:.8rem;font-weight:700;position:relative}
.person svg{width:100%;max-width:88px;height:auto}
.person.armed{border-color:var(--sky);background:#EAF0FF}
.person .badge{position:absolute;top:6px;right:6px;background:var(--ink);color:#fff;border-radius:999px;width:22px;height:22px;display:grid;place-items:center;font-size:.75rem}
.quotes{display:grid;gap:8px}
.quote{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.quote .n{font-family:var(--display);font-size:.8rem;background:var(--sun);border-radius:999px;width:24px;height:24px;flex:none;display:grid;place-items:center}
.quote.armed{border-color:var(--sky);background:#EAF0FF}
.quote .who{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--sky);white-space:nowrap}
.quote.ok{border-color:var(--mint)}.quote.bad{border-color:var(--wrong)}
/* Žebříček */
.board{display:grid;gap:8px}
.lb{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 16px;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.lb .r{font-family:var(--display);font-size:1.1rem}
.lb .s{font-family:var(--display)}
.lb.p1{background:var(--sun);border-color:var(--sun)}.lb.p2{background:#E3E7F3}.lb.p3{background:#F6D9C4}
.lb.me{border-color:var(--sky)}
.tv h1{font-size:clamp(1.6rem,4vw,3rem)}
.tv .lb{font-size:clamp(1rem,2.2vw,1.6rem);padding:clamp(12px,1.6vw,20px) clamp(16px,2vw,28px)}
.demo{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="bar"><span class="logo">SHORT<b>PRO</b> × OPTIONS</span><span class="pts" id="pts">0 b</span></div>
  <main id="app" class="screen" aria-live="polite"></main>
</div>

<script>
/* Konfigurace: SCORE_API = URL serveru pro společný žebříček (POST {nick,task,points}, GET -> [{nick,total}]).
   Bez něj se žebříček ukládá jen v tomto zařízení (náhled). STORY_PIN = kód, který zadá dobrovolník u Story. */
const SCORE_API = '';
const STORY_PIN = '2811';

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a };

let state = load('sp-state', {nick:'', scores:{}});
const total = () => Object.values(state.scores).reduce((a,b)=>a+b,0);
function setScore(task, pts){
  state.scores[task] = Math.max(state.scores[task]||0, pts); save('sp-state', state); updPts();
  const board = load('sp-board', {}); board[state.nick] = total(); save('sp-board', board);
  if(SCORE_API) fetch(SCORE_API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nick:state.nick, task, points:state.scores[task]})}).catch(()=>{});
}
function updPts(){ $('#pts').textContent = total() + ' b' }

/* Kelímek Bataronu jako ilustrace (SVG) */
function cup(h=90, flavor='#F2482B'){
  const w = Math.round(h*0.8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 80 100" aria-hidden="true">
    <rect x="4" y="6" width="72" height="10" rx="3" fill="#E9E4D8"/>
    <path d="M8 16 H72 L64 96 H16 Z" fill="${flavor}"/>
    <path d="M12 40 H68 L66 58 H14 Z" fill="#fff" opacity=".92"/>
    <text x="40" y="53" text-anchor="middle" font-family="Unbounded,Arial Black,sans-serif" font-size="10" font-weight="800" fill="#141B34">BATARON</text>
    <circle cx="40" cy="78" r="8" fill="#FFC53D"/></svg>`;
}

const TASKS = [
  {id:'story', ic:'🎬', bg:'#FFE1D9', name:'Natoč Story', role:'Kreativa a produkce', time:'4 min'},
  {id:'triky', ic:'🧠', bg:'#FFF1C7', name:'Marketingové triky', role:'Jak prodávat chytře', time:'3 min'},
  {id:'influ', ic:'📱', bg:'#E0E8FF', name:'Vyber influencera', role:'Analytika a rozpočet', time:'3 min'},
  {id:'tym', ic:'🧩', bg:'#DDF5EA', name:'Sestav tým', role:'Projektový manažer', time:'3 min'},
  {id:'kdo', ic:'💬', bg:'#F0E2FF', name:'Kdo to řekl?', role:'Role v agentuře', time:'2 min'},
];

/* ---------- Domů ---------- */
function home(){
  app.innerHTML = `
  <section class="hero">
    <span class="eyebrow" style="color:var(--sun)">Marketingová agentura na 15 minut</span>
    <h1>Dnes pracuješ pro značku Bataron</h1>
    <p>Batátové nudle, které chtějí do Česka. Splň 5 úkolů, jaké řešíme v agentuře každý den. Za každý dostaneš razítko v aplikaci Options a body do našeho žebříčku.</p>
    <div class="cup">${cup(150)}</div>
  </section>
  ${state.nick ? `<p class="lead">Hraješ jako <b>${esc(state.nick)}</b>. Vyber úkol, pořadí je jedno.</p>` : nickForm()}
  <div class="tasks">${TASKS.map(t=>{
    const s = state.scores[t.id];
    return `<button class="task ${s!=null?'done':''}" data-go="${t.id}" ${state.nick?'':'disabled'}>
      <span class="ic" style="background:${t.bg}">${t.ic}</span>
      <span class="t"><b>${t.name}</b><small>${t.role} · ${t.time}</small></span>
      <span class="st">${s!=null? s+' b':'›'}</span></button>`}).join('')}</div>
  <button class="btn alt full" data-go="zebricek">🏆 Žebříček</button>`;
  bindNick();
}
function nickForm(){
  return `<form class="nick" id="nickf"><label for="nick"><b>Tvoje přezdívka do žebříčku</b></label>
  <div class="row"><input id="nick" maxlength="18" autocomplete="off" placeholder="např. NudlovýKrál" required><button class="btn">Hrát</button></div>
  <span class="hint">Žádné jméno ani e-mail, stačí přezdívka.</span></form>`;
}
function bindNick(){
  const f = $('#nickf'); if(!f) return;
  f.addEventListener('submit', e=>{ e.preventDefault(); const v = $('#nick').value.trim(); if(!v) return; state.nick = v; save("sp-state", state); route(); });
}
function header(t){ return `<button class="back" data-go="">← Všechny úkoly</button><span class="eyebrow">${t.role}</span>` }
function finish(task, pts, max, text){
  setScore(task, pts);
  return `<div class="result"><span class="eyebrow" style="color:var(--sun)">Hotovo</span><span class="big">${pts} / ${max} b</span><p>${text}</p>
  <p>Razítko si vyzvedni v aplikaci Options.</p>
  <button class="btn alt full" data-go="" style="background:#fff">Další úkol</button></div>`;
}

/* ---------- 1 Story ---------- */
const HOOKS = ['Večeře za 3 minuty, která není z mikrovlnky','Tohle jsem od instantních nudlí nečekal','Učení do noci? Tohle je můj plán B','POV: máš hlad a za 5 minut hraješ ranked','Batátové nudle. Jo, z batátů.','Řekni mi, že jsi to už zkusil. Ne? Tak koukej.'];
const STORY_CHECKS = ['Hook: první věta nebo text diváka zastaví do 2 sekund','Kelímek Bataronu je v záběru jasně vidět','Řekneš nebo napíšeš, proč to zkusit','Označíš @options a @shortpro'];
let hookI = 0, storyOn = [];
function story(){
  const t = TASKS[0];
  app.innerHTML = `${header(t)}<h2>Natoč Story, které zastaví palec</h2>
  <p class="lead">Jsi tvůrce obsahu pro Bataron. Vezmi si kelímek ze stolu a natoč Story do 15 sekund. Stačí jeden záběr nebo tři krátké.</p>
  <div class="phone"><div class="bars"><i></i><i></i><i></i></div>
    <div class="hook" id="hook">${HOOKS[hookI]}</div>
    <div class="cupwrap">${cup(120)}</div>
    <div class="tags"><span>@options</span><span>@shortpro</span></div></div>
  <button class="btn alt full" id="nexthook">🎲 Jiný nápad na hook</button>
  <h3>Kontrolní seznam</h3>
  <div class="checks">${STORY_CHECKS.map((c,i)=>`<button class="check ${storyOn[i]?'on':''}" data-chk="${i}"><span class="box">${storyOn[i]?'✓':''}</span><span>${c}</span></button>`).join('')}</div>
  <p class="hint">Nemáš Instagram nebo nechceš zveřejňovat? Natoč video jen do mobilu a ukaž ho. Počítá se to taky.</p>
  <h3>Ukaž Story dobrovolníkovi</h3>
  <form class="pin" id="pinf"><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="Kód dobrovolníka"><button class="btn">Potvrdit</button></form>
  <span class="hint">Kód zadá dobrovolník, až Story uvidí.</span><span class="err" id="pinerr"></span><div id="sres"></div>`;
  $('#nexthook').onclick = ()=>{ hookI=(hookI+1)%HOOKS.length; $('#hook').textContent = HOOKS[hookI] };
  app.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.chk; storyOn[i]=!storyOn[i]; b.classList.toggle('on'); b.querySelector('.box').textContent = storyOn[i]?'✓':'' });
  $('#pinf').addEventListener('submit', e=>{ e.preventDefault();
    if($('#pin').value !== STORY_PIN){ $('#pinerr').textContent = 'Kód nesedí. Ať ho zadá dobrovolník.'; return }
    const pts = 60 + storyOn.filter(Boolean).length*10;
    $('#pinf').hidden = true; $('#pinerr').textContent='';
    $('#sres').innerHTML = finish('story', pts, 100, 'Tohle dělá každý den náš kreativní tým: hook, produkt, důvod a označení. Body jsou i za odškrtnutý seznam.');
  });
}

/* ---------- 2 Marketingové triky ---------- */
const TRICKS = [

let tq = 0, tAns = [];
function triky(){
  const t = TASKS[1];
  if(tq >= TRICKS.length){
    const ok = tAns.filter(Boolean).length; const pts = Math.round(ok/TRICKS.length*100);
    app.innerHTML = `${header(t)}<h2>Teď víš, jak tě obchody ovlivňují</h2>` + finish('triky', pts, 100, `Správně ${ok} ze ${TRICKS.length}. Až půjdeš příště nakupovat, zkus najít aspoň tři z těchhle triků.`);
    return;
  }
  const T = TRICKS[tq];
  const order = shuffle(T.o.map((x,i)=>i));
  app.innerHTML = `${header(t)}
  <div class="qprog">${TRICKS.map((x,i)=>`<i class="${i<tq?(tAns[i]?'ok':'bad'):i===tq?'cur':''}"></i>`).join('')}</div>
  <div class="scene">${T.scene()}</div>
  <h2>${T.q}</h2>
  <div class="opts">${order.map((i,k)=>`<button class="opt" data-o="${i}"><b>${'ABC'[k]}</b><span>${T.o[i]}</span></button>`).join('')}</div>
  <div id="ex"></div>`;
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    if(tAns.length > tq) return;
    const i = +b.dataset.o, ok = i===T.a; tAns[tq] = ok;
    app.querySelectorAll('[data-o]').forEach(x=>{ const j=+x.dataset.o; if(j===T.a) x.classList.add('ok'); else if(x===b) x.classList.add('bad'); x.disabled=true });
    $('#ex').innerHTML = `<div class="explain"><strong>${ok?'Správně! ':'Tohle je '} ${T.e[0]}</strong>${T.e[1]}</div><br><button class="btn full" id="nq">${tq+1<TRICKS.length?'Další':'Vyhodnotit'}</button>`;
    $('#nq').onclick = ()=>{ tq++; triky(); };
  });
}

}
